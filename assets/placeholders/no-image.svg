<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220"
     role="img" aria-label="No image available">
  <title>No image available</title>
  <rect x="1" y="1" width="318" height="218" rx="10" fill="#f2f4f8"
        stroke="#c9d1de" stroke-width="2" stroke-dasharray="8 6"/>
  <g transform="translate(160 96)">
    <!-- Picture frame glyph -->
    <rect x="-52" y="-38" width="104" height="76" rx="7" fill="#ffffff" stroke="#aab6c8" stroke-width="3"/>
    <circle cx="-24" cy="-14" r="9" fill="#d6dce7"/>
    <path d="M-46 26 l30-32 21 22 14-13 29 23 Z" fill="#c2cbdb"/>
