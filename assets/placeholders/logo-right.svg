<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120"
     role="img" aria-label="Meridian Vision Lab logo">
  <title>Meridian Vision Lab</title>
  <defs>
    <linearGradient id="lgRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12a594"/>
      <stop offset="100%" stop-color="#0b6e7f"/>
    </linearGradient>
  </defs>

  <!-- Iris / aperture mark -->
  <g transform="translate(52 60)">
    <circle r="40" fill="none" stroke="url(#lgRing)" stroke-width="7"/>
    <circle r="27" fill="#e6f6f4"/>
    <g stroke="#0b6e7f" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <line x1="0" y1="-24" x2="0" y2="-13"/>
      <line x1="17" y1="-17" x2="9" y2="-9"/>
      <line x1="24" y1="0" x2="13" y2="0"/>
      <line x1="17" y1="17" x2="9" y2="9"/>
      <line x1="0" y1="24" x2="0" y2="13"/>
      <line x1="-17" y1="17" x2="-9" y2="9"/>
      <line x1="-24" y1="0" x2="-13" y2="0"/>
      <line x1="-17" y1="-17" x2="-9" y2="-9"/>
    </g>
    <circle r="9" fill="#0f3057"/>
    <circle cx="-3.4" cy="-3.4" r="2.8" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="106" y="52" font-size="25" font-weight="700" fill="#0b6e7f" letter-spacing="-0.3">Meridian</text>
    <text x="106" y="76" font-size="15" font-weight="500" fill="#12a594" letter-spacing="2.2">VISION LAB</text>
    <text x="106" y="97" font-size="10.5" fill="#6b7a90" letter-spacing="0.6">Computational Ophthalmic Imaging</text>
  </g>
</svg>
