<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="Subtle grid texture">
  <title>Subtle grid texture</title>
  <!--
    Designed to tile seamlessly at 96x96 (one inch at 96 px/in). Deliberately low-contrast so it
    reads as paper texture behind poster content rather than competing with it. Pair it with the
    background opacity slider in the Canvas & Page panel.
  -->
  <defs>
    <pattern id="fine" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0 V12 M0 12 H12" fill="none" stroke="#c9d6e8" stroke-width="0.5" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="96" height="96" fill="#ffffff"/>
  <rect width="96" height="96" fill="url(#fine)"/>

  <!-- Major rules on the tile boundary -->
  <path d="M96 0 V96 M0 96 H96" fill="none" stroke="#aebfd6" stroke-width="1"/>

  <!-- Intersection dots -->
  <g fill="#9db0ca" opacity="0.75">
    <circle cx="0" cy="0" r="1.4"/>
    <circle cx="96" cy="0" r="1.4"/>
    <circle cx="0" cy="96" r="1.4"/>
    <circle cx="96" cy="96" r="1.4"/>
    <circle cx="48" cy="48" r="1.1"/>
  </g>
</svg>
