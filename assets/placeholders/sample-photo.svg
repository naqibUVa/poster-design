<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400"
     role="img" aria-label="Stylised retinal fundus image placeholder">
  <title>Retinal fundus placeholder</title>
  <desc>Abstract vector stand-in for a fundus photograph or microscopy panel.</desc>

  <defs>
    <radialGradient id="fundus" cx="46%" cy="48%" r="62%">
      <stop offset="0%"  stop-color="#f0a35e"/>
      <stop offset="45%" stop-color="#c96f33"/>
      <stop offset="82%" stop-color="#7d3b18"/>
      <stop offset="100%" stop-color="#40190a"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff3d6"/>
      <stop offset="62%" stop-color="#f6d68a"/>
      <stop offset="100%" stop-color="#d9a24d"/>
    </radialGradient>
    <radialGradient id="macula" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#5a2409" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a2409" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="260" cy="200" r="188"/></clipPath>
  </defs>

  <rect width="520" height="400" fill="#120806"/>
  <circle cx="260" cy="200" r="188" fill="url(#fundus)"/>

  <g clip-path="url(#globe)">
    <!-- Vessel arcades -->
    <g fill="none" stroke="#8e2b16" stroke-linecap="round" opacity="0.92">
      <path d="M352 196 C300 150 240 128 150 118" stroke-width="9"/>
      <path d="M352 204 C300 252 238 278 148 292" stroke-width="9"/>
      <path d="M352 190 C330 132 318 92 300 42" stroke-width="6"/>
      <path d="M352 212 C332 272 322 320 306 366" stroke-width="6"/>
      <path d="M300 168 C250 132 196 118 128 64" stroke-width="4.5"/>
      <path d="M296 236 C246 274 198 292 132 340" stroke-width="4.5"/>
      <path d="M232 143 C196 122 150 116 96 148" stroke-width="3"/>
      <path d="M228 262 C192 284 148 292 92 262" stroke-width="3"/>
      <path d="M318 120 C300 92 292 66 288 30" stroke-width="2.4"/>
      <path d="M320 286 C304 316 298 344 296 376" stroke-width="2.4"/>
    </g>
    <g fill="none" stroke="#c0503a" stroke-linecap="round" opacity="0.7">
      <path d="M346 200 C296 168 246 152 168 146" stroke-width="3.4"/>
      <path d="M346 206 C298 240 248 258 170 266" stroke-width="3.4"/>
      <path d="M280 156 C244 140 206 138 164 96" stroke-width="2"/>
      <path d="M276 250 C240 268 204 274 162 314" stroke-width="2"/>
    </g>

    <!-- Optic disc -->
    <ellipse cx="352" cy="200" rx="36" ry="39" fill="url(#disc)"/>
    <ellipse cx="352" cy="200" rx="17" ry="19" fill="#e8b866" opacity="0.85"/>

    <!-- Macula / fovea -->
    <circle cx="212" cy="206" r="52" fill="url(#macula)"/>
    <circle cx="212" cy="206" r="7" fill="#43190a" opacity="0.75"/>

    <!-- Speckle for photographic texture -->
    <g fill="#ffd9a0" opacity="0.13">
      <circle cx="120" cy="180" r="2.4"/><circle cx="168" cy="330" r="1.8"/>
      <circle cx="396" cy="120" r="2.1"/><circle cx="430" cy="264" r="1.6"/>
      <circle cx="248" cy="86"  r="1.9"/><circle cx="300" cy="330" r="2.2"/>
      <circle cx="98"  cy="242" r="1.5"/><circle cx="376" cy="330" r="1.7"/>
    </g>
  </g>

  <!-- Vignette + scale bar -->
  <circle cx="260" cy="200" r="188" fill="none" stroke="#000000" stroke-width="26" opacity="0.28"/>
  <circle cx="260" cy="200" r="188" fill="none" stroke="#1f1410" stroke-width="2"/>
  <g opacity="0.9">
    <rect x="376" y="352" width="84" height="5" rx="2" fill="#ffffff"/>
    <text x="418" y="345" text-anchor="middle" fill="#ffffff" font-size="13"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">500 µm</text>
  </g>
</svg>
